services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    container_name: mongoDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
      - ./scripts/schemaScript.js:/docker-entrypoint-initdb.d/schemaScript.js:ro
    networks:
      - overm-network

  api-recipe-catalog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-recipe-catalog
    depends_on:
      - mongo
    env_file:
      - .env_compose
    environment:
      ENV: "develop"
    networks:
      - overm-network
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  overm-network:
    external: true