services:
  mongo-recipe-catalog:
    image: mongo:8
    restart: unless-stopped
    container_name: mongo-recipe-catalog-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    volumes:
      - mongo-recipe-catalog-data:/data/db
      - ./scripts/schemaScript.js:/docker-entrypoint-initdb.d/schemaScript.js:ro
    networks:
      - overm-network

  api-recipe-catalog:
    image: api-recipe-catalog:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-recipe-catalog-dev
    depends_on:
      mongo-recipe-catalog:
        condition: service_healthy
    env_file:
      - .env_compose
    environment:
      ENV: "develop"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/readyz"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - overm-network
    ports:
      - "${API_RECIPE_CATALOG_HOST:-8082}:8080"
    restart: unless-stopped

volumes:
  mongo-recipe-catalog-data:

networks:
  overm-network:
    external: true